# Legacy API-image example, NOT the verified interview startup path.
# Use `python -m scripts.showcase init --run-id <fresh_id>` for the tested
# host API + owned PostgreSQL/Redis/Qdrant Compose profile. This file alone
# does not provision auth/Redis/Qdrant; production startup correctly refuses it.
# Paid providers are deliberately disabled even when the shell/.env has keys.
services:
  api:
    build: .
    container_name: adaptive-rag
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/local/app.db
      REDIS_URL: ""
      QDRANT_URL: ""
      APP_ENV: production
      LOG_LEVEL: INFO
      DEEPSEEK_API_KEY: ""
      EMBEDDING_API_KEY: ""
      AUTH_MODE: required
      AUTH_CREDENTIALS: ${AUTH_CREDENTIALS:-}
      KNOWLEDGE_MODE: private
      EXPERIENCE_MEMORY_MODE: "off"
      MCP_ENABLED: "false"
      LOCAL_EMBEDDING_ENABLED: "false"
      CROSS_ENCODER_ENABLED: "false"
      UNSTRUCTURED_ENABLED: "false"
    volumes:
      - adaptive-rag-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  adaptive-rag-data:
