# Ubuntu-verified local demo; Windows Docker Desktop remains unverified.
# docker compose -f compose.showcase.yml up -d --build
name: adaptive-rag-showcase

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
    target: showcase
  user: "1000:1000"
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  tmpfs: ["/tmp:rw,nosuid,nodev,size=128m,mode=1777"]
  labels: {io.adaptive-rag.showcase: "s1-docker-v1"}
  environment: &offline
    DEEPSEEK_API_KEY: ""
    EMBEDDING_API_KEY: ""
    AUTH_CREDENTIALS: ""
    LANGSMITH_API_KEY: ""
    AGENT_LANGSMITH_API_KEY: ""
    EXPERIENCE_MEMORY_MODE: "off"
    MCP_ENABLED: "false"
    LOCAL_EMBEDDING_ENABLED: "false"
    CROSS_ENCODER_ENABLED: "false"
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"

services:
  bootstrap:
    <<: *app
    user: "0:0"
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    command: [python, -m, app.demo.docker, bootstrap]
    network_mode: none
    restart: "no"
    volumes:
      - db_secret:/run/showcase-db
      - showcase_state:/var/lib/showcase

  postgres:
    image: postgres:16-alpine
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    environment:
      POSTGRES_USER: adaptive
      POSTGRES_DB: adaptive_showcase
      POSTGRES_PASSWORD_FILE: /run/showcase-db/postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - db_secret:/run/showcase-db:ro
    networks: [showcase]
    restart: unless-stopped
    labels: {io.adaptive-rag.showcase: "s1-docker-v1"}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U adaptive -d adaptive_showcase']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: ["redisdata:/data"]
    networks: [showcase]
    restart: unless-stopped
    labels: {io.adaptive-rag.showcase: "s1-docker-v1"}
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.12.5
    volumes: ["qdrantdata:/qdrant/storage"]
    networks: [showcase]
    restart: unless-stopped
    labels: {io.adaptive-rag.showcase: "s1-docker-v1"}
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - 'exec 3<>/dev/tcp/127.0.0.1/6333; printf "GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; IFS= read -r line <&3; [[ "$$line" == *" 200 "* ]]'
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  initialize:
    <<: *app
    command: [python, -m, app.demo.docker, initialize]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
    networks: [showcase]
    restart: "no"
    volumes:
      - db_secret:/run/showcase-db:ro
      - showcase_state:/var/lib/showcase

  api:
    <<: *app
    command: [python, -m, app.demo.docker, serve]
    depends_on:
      initialize: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
    networks: [showcase]
    ports: ["127.0.0.1:${SHOWCASE_PORT:-8000}:8000"]
    restart: unless-stopped
    volumes:
      - db_secret:/run/showcase-db:ro
      - showcase_state:/var/lib/showcase:ro
    healthcheck:
      test: [CMD, python, -m, app.demo.docker, health]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

networks:
  showcase:
    internal: true
    labels: {io.adaptive-rag.showcase: "s1-docker-v1"}

volumes:
  pgdata:
    labels: {io.adaptive-rag.showcase: "s1-docker-v1"}
  redisdata:
    labels: {io.adaptive-rag.showcase: "s1-docker-v1"}
  qdrantdata:
    labels: {io.adaptive-rag.showcase: "s1-docker-v1"}
  db_secret:
    labels: {io.adaptive-rag.showcase: "s1-docker-v1"}
  showcase_state:
    labels: {io.adaptive-rag.showcase: "s1-docker-v1"}
